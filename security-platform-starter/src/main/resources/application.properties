# Security Platform Starter Configuration
# Configure these properties in your application.properties or application.yml

# Enable/disable the security platform starter
security.platform.enabled=true

# Enable security headers (X-Frame-Options, X-XSS-Protection, HSTS, etc.)
security.platform.security-headers-enabled=true

# Enable CORS configuration
security.platform.cors-enabled=false

# Enable CSRF protection
security.platform.csrf-enabled=true

# Enable actuator security
security.platform.actuator-security-enabled=true

# Enable vulnerability check logging on startup
security.platform.vulnerability-check-on-startup=true
